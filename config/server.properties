# Our settings for the local test server: the sandbox the agent builds in. docker/entrypoint.sh merges
# these into server/server.properties (Paper's full file, gitignored: it holds a generated secret).
# Inside Docker the server listens on all interfaces; compose.yaml publishes it on 127.0.0.1 only.
server-ip=
server-port=25565
online-mode=true
white-list=true
motd=mc-architect test server

# A fixed seed so eval sites (same terrain, same coordinates) are reproducible.
level-name=world
level-seed=mc-architect
gamemode=creative
force-gamemode=true
difficulty=peaceful
spawn-protection=0

# Command blocks stay off: a pasted build must never be able to run commands.
enable-command-block=false
enable-rcon=false
view-distance=12
simulation-distance=8
